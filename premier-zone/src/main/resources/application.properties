spring.application.name=premier-zone

# Run the backend on port 8081 (default is 8080)
server.port=${PORT:8081}

# Database: set DB_URL / DB_USERNAME / DB_PASSWORD when hosting. Defaults are the local setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pl_data}
spring.datasource.username=${DB_USERNAME:aj}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}

# Which websites may call the API from a browser (comma-separated). Add your portfolio's URL when hosting,
# e.g. CORS_ORIGINS=https://your-portfolio.vercel.app,http://localhost:3000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# When true, POST/PUT/DELETE are refused (403). Turn this on for any public deployment:
# the API has no login, so otherwise anyone could edit or delete players.
app.read-only=${READ_ONLY:false}
